# Default OpenSearch/ES target + header-auth overrides.
# Replace OPENSEARCH_* values before deploy (or oc create/set secret).
#
# Clients can still override per request (ES MCP style):
#   opensearch-url: https://<other-host>
#   Authorization: Basic <base64(user:pass)>
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-mcp-creds
  namespace: opensearch-mcp
  labels:
    app.kubernetes.io/name: opensearch-mcp-server
    app.kubernetes.io/part-of: opensearch-mcp
type: Opaque
stringData:
  OPENSEARCH_HEADER_AUTH: "true"
  OPENSEARCH_DYNAMIC_CONNECTION: "false"
  OPENSEARCH_SSL_VERIFY: "false"
  # Placeholders only — replace on the cluster, do not commit real credentials
  OPENSEARCH_URL: "https://search-example.us-west-2.es.amazonaws.com"
  OPENSEARCH_USERNAME: "admin"
  OPENSEARCH_PASSWORD: "changeme"
