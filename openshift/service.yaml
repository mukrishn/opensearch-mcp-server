apiVersion: v1
kind: Service
metadata:
  name: opensearch-mcp
  namespace: opensearch-mcp
  labels:
    app.kubernetes.io/name: opensearch-mcp-server
    app.kubernetes.io/part-of: opensearch-mcp
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: opensearch-mcp-server
    app.kubernetes.io/component: server
  ports:
    - name: mcp
      port: 9900
      targetPort: mcp
      protocol: TCP
  type: ClusterIP
